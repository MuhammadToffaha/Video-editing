<!doctype html><html lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
<svg id="paper" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- slight marker wobble so lines look hand-drawn (static pattern: no boiling) -->
    <filter id="wob" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
  </defs>
  <g id="art" filter="url(#wob)"></g>
  <g id="pens"></g>
</svg>
<div id="stage"><div id="banner">K-BEAUTY</div><img id="wm" src="../assets/logo_brand.png"><div id="caps"></div></div>
<svg id="hand" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><g id="handg" transform="translate(1400,1500)"></g></svg>
<div id="outro"><img src="../assets/logo_white.png"></div>
<script src="vendor/gsap.min.js"></script><script src="transcript.js"></script><script src="wb.js"></script>
</body></html>
